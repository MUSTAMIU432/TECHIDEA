name: CI

# Continuous integration only: validates code quality, tests and builds.
# Nothing is deployed and no repository secrets are used.

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

# A newer push to the same PR/branch supersedes the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: automation_platform_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        # The job waits until PostgreSQL accepts connections.
        options: >-
          --health-cmd "pg_isready -U ci_user -d automation_platform_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # CI-only values (see backend/.env.example). They are not secrets and have
    # no use outside this throwaway job. config.settings.local is selected by
    # pytest.ini and manage.py; the tests cover config.settings.production
    # themselves.
    env:
      ENVIRONMENT: ci
      DJANGO_SECRET_KEY: ci-only-secret-key
      # Sprint 1 (S1-003): signs JWT access tokens, deliberately distinct
      # from DJANGO_SECRET_KEY (see backend/config/settings/base.py).
      DJANGO_JWT_SIGNING_KEY: ci-only-jwt-signing-key
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://ci_user:ci-only-password@localhost:5432/automation_platform_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: Check formatting (Ruff)
        run: ruff format --check .

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to PostgreSQL
        run: python manage.py migrate --noinput

      - name: Tests (pytest with coverage)
        run: pytest --cov

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Check formatting (oxfmt)
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm run test:run

      - name: Production build
        run: npm run build
